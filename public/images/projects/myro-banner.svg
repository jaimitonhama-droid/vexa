<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Deep black cinema background with subtle central red/dark aura -->
    <radialGradient id="myroAura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#24070B" />
      <stop offset="60%" stop-color="#0E0507" />
      <stop offset="100%" stop-color="#050304" />
    </radialGradient>

    <!-- Drop shadow for huge logo -->
    <filter id="myroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#E50914" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed Solid Background filling 100% -->
  <rect width="800" height="480" fill="url(#myroAura)" />

  <!-- Top bar indicators -->
  <g transform="translate(40, 35)">
    <rect width="115" height="26" rx="6" fill="#E50914" fill-opacity="0.25" stroke="#E50914" stroke-width="1" />
    <text x="57" y="18" font-family="'Arial Black', 'Inter', sans-serif" font-weight="900" font-size="11" fill="#FF4D5A" text-anchor="middle">STREAMING HD</text>
  </g>

  <g transform="translate(680, 35)">
    <rect width="80" height="26" rx="6" fill="#0D0D14" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12" />
    <circle cx="16" cy="13" r="4" fill="#22C55E" />
    <text x="48" y="17" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#F4F5FA" text-anchor="middle">ONLINE</text>
  </g>

  <!-- HUGE MYRO LOGO FILLING THE ENTIRE CENTRAL AREA PROMINENTLY -->
  <!-- Exact requested style: White 'M', Bold Red 'YRO' -->
  <g transform="translate(400, 260)" filter="url(#myroShadow)">
    <text x="0" y="0" font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" font-weight="900" font-size="160" text-anchor="middle" letter-spacing="-3">
      <tspan fill="#FFFFFF">M</tspan><tspan fill="#E50914">YRO</tspan>
    </text>
  </g>

  <!-- Bottom Subtitle pill filling width with categories: Filmes, Músicas, Desenhos -->
  <g transform="translate(400, 375)">
    <rect x="-290" y="-18" width="580" height="38" rx="19" fill="#11070A" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="0" y="6" font-family="'Inter', 'Arial', sans-serif" font-weight="700" font-size="13" fill="#F4F5FA" text-anchor="middle" letter-spacing="2">
      FILMES  •  MÚSICAS  •  DESENHOS ANIMADOS  •  SÉRIES
    </text>
  </g>
</svg>
